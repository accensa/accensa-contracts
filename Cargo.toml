[workspace]
members = [
    "contracts/receipt-anchor",
    "contracts/refund-vault",
]
resolver = "2"

[workspace.dependencies]
soroban-sdk = "27.0.4"

[workspace.lints.rust]
warnings = "deny"

[workspace.lints.clippy]
all = "warn"

[profile.dev]
overflow-checks = true

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

[profile.release-with-logs]
inherits = "release"
debug-assertions = true
