[package]
name = "state-channel"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Unidirectional state channel for high-frequency off-chain anchoring on Stellar"

[lints]
workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[features]
budget-assert = ["dep:budget_macros"]

[dependencies]
soroban-sdk = { workspace = true }
accensa-common = { workspace = true }
budget_macros = { git = "https://github.com/Tollcraft/soroban-budget-assert.git", branch = "main", package = "budget-macros", optional = true }

[dev-dependencies]
ed25519-dalek = "3.0"
soroban-sdk = { workspace = true, features = ["testutils"] }
