[package]
name = "refund-policy-time"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Stateless time-window/deadline refund policy (issue #129)"

[lints]
workspace = true


[lib]
crate-type = ["cdylib", "rlib"]

[features]
# Enables the Tier A budget-assertion tests in `src/budget_test.rs`. Off by
# default so ordinary `cargo test` / `cargo clippy` runs do not require the
# prebuilt WASM artifact or pull in the `budget_macros` optional dependency.
# The budget CI job enables it explicitly after building the contract to WASM.
budget-assert = ["dep:budget_macros"]

[dependencies]
soroban-sdk = { workspace = true }
accensa-common = { workspace = true }
# Tollcraft/soroban-budget-assert — Tier A local assertion macros, used only
# by the `#[cfg(all(test, feature = "budget-assert"))]`-gated `budget_test`
# module. Cargo does not allow optional *dev*-dependencies, so this lives here,
# optional, gated by the `budget-assert` feature; it never links into a real
# (non-test) build. Pinned to the url+rev resolved in Cargo.lock (branch
# `main`), the same source `receipt-anchor` and `refund-policy-vdf` use.
budget_macros = { git = "https://github.com/Tollcraft/soroban-budget-assert.git", branch = "main", package = "budget-macros", optional = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }