[package]
name = "refund-vault"
version = "0.2.0"
edition = "2021"
description = "Accensa Refund Vault Contract"
repository = "https://github.com/accensa/accensa-contracts"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = { workspace = true }

[dev-dependencies]
proptest = "1.4"
soroban-sdk = { workspace = true, features = ["testutils"] }
receipt-anchor = { path = "../receipt-anchor" }
