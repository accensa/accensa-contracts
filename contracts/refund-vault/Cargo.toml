[lints]
workspace = true


[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = { workspace = true }
accensa-common = { workspace = true }

[dev-dependencies]
multisig-account = { path = "../multisig-account", features = ["testutils"] }
